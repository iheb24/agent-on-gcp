[project]
name = "agent-on-gcp"
version = "0.1.0"
description = "A BigQuery natural language agent deployed on GCP using Cloud Run and the Gemini Agent Platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.25.0",
    "google-auth>=2.40.0",
    "google-cloud-bigquery>=3.45.2",
    "google-cloud-aiplatform>=2.2.0",
    "httpx>=0.28.0",
    "mcp>=2.2.0",
    "google-adk[otel-gcp]>=2.10.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "pydantic>=2.10.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "isort",
    "ruff",
    "pre-commit",
    "checkov",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
  "."
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
    "pyproject.toml:version"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["venv", ".venv"]
explicit_package_bases = true
